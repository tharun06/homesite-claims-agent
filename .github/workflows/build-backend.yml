name: Build backend image

# Builds the backend container in GitHub's cloud and pushes it to GitHub Container
# Registry (ghcr.io). Deliberately NOT Azure Container Registry: ACR Basic costs
# ~$5.07/month standing with no free tier, which would exceed this project's whole
# budget. ghcr.io is free for public images with unlimited anonymous pulls.
on:
  push:
    branches: [main]
    paths:
      - 'adjuster-dashboard/backend/**'
      - '.github/workflows/build-backend.yml'
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homesite-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: adjuster-dashboard/backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        run: |
          echo "Pushed ${{ env.IMAGE }}:latest"
          echo "        ${{ env.IMAGE }}:${{ github.sha }}"
          echo ""
          echo "NOTE: on the first push the package is PRIVATE."
          echo "Make it public once at:"
          echo "  https://github.com/users/${{ github.repository_owner }}/packages/container/homesite-backend/settings"
          echo "-> Change visibility -> Public"
          echo "That keeps pulls free and unlimited, and means Azure needs no registry credentials."
