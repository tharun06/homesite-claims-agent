name: Build copilot image

# Builds the LangGraph copilot (which bundles the stdio MCP server) and pushes to
# ghcr.io. As with the backend, deliberately not Azure Container Registry — ACR
# Basic is ~$5.07/month standing with no free tier.
#
# NOTE: pushing a new image does NOT redeploy it. Azure pinned its revision to the
# image it pulled at creation time. Deploying a change is currently a manual
# `az containerapp update --image ...:<sha>`. See ROADMAP.md, "the :latest gap".
on:
  push:
    branches: [main]
    paths:
      - 'adjuster-dashboard/copilot/**'
      - '.github/workflows/build-copilot.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homesite-copilot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: adjuster-dashboard/copilot
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Next step
        run: |
          echo "Pushed ${{ env.IMAGE }}:${{ github.sha }}"
          echo "If this is the FIRST build, make the package public once:"
          echo "  https://github.com/users/${{ github.repository_owner }}/packages/container/homesite-copilot/settings"
