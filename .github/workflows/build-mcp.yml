name: Build MCP server image

# The MCP server deployed as its own remote service, so Claude / ChatGPT / other
# internal services can reach it over HTTPS rather than only as a local
# subprocess of the copilot.
on:
  push:
    branches: [main]
    paths:
      - 'adjuster-dashboard/copilot/mcp_server.py'
      - 'adjuster-dashboard/copilot/Dockerfile.mcp'
      - '.github/workflows/build-mcp.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homesite-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: adjuster-dashboard/copilot
          file: adjuster-dashboard/copilot/Dockerfile.mcp
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Next step
        run: |
          echo "Pushed ${{ env.IMAGE }}:${{ github.sha }}"
          echo "If this is the FIRST build, make the package public once:"
          echo "  https://github.com/users/${{ github.repository_owner }}/packages/container/homesite-mcp/settings"
